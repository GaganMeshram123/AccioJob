    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        /* Gallery */
        .container {
            width: 100%;

            display: grid;
            grid-template-columns: repeat(4, 150px);
            gap: 20px;

            justify-content: space-between;
        }

        /* Thumbnail */
        .childContainer {
            width: 150px;
            height: 150px;

            border: 1px solid #ff7200;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        .childContainer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        /* Large image popup */
        .thumbnailContainer {
            width: 500px;
            height: 500px;

            position: fixed;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            background: white;
            border: 2px solid #ff7200;

            padding: 10px;

            z-index: 1000;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }


        /* Image wrapper */
        .mainImgContainer {
            width: 100%;
            height: 100%;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* Large image */
        .mainImgContainer img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* Close button */
        .mainImgContainer button {
            position: absolute;

            top: 10px;
            right: 10px;

            width: 35px;
            height: 35px;

            border: none;
            border-radius: 50%;

            background-color: #ff7200;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* Close button hover */
        .mainImgContainer button:hover {
            background-color: #000;
        }


        /* Hide popup */
        .displayThumbnailContainer {
            display: none;
        }
    </style>
</head>

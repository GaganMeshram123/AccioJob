<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .riddhi {
             border: 1px solid black;
    padding: 15px;
    border-radius: 10px;
}
    </style>
</head>

<body>
    <div id="container"></div>
    <script>
        async function gagan() {
            try {
                const gagan1 = await fetch("https://jsonplaceholder.typicode.com/comments");
                const gag = await gagan1.json();
                console.log(gag);

                let container = document.getElementById("container");
                gag.forEach(val => {
                    console.log(val);
                    let cringe = document.createElement("div");
                    cringe.className = "riddhi";

                    cringe.innerHTML = `
                     <h3>${val.name}</h3>
                     <h3>${val.email}</h3>
                     <h3>${val.body}</h3>
                    `
                    container.append(cringe);
                });
            } catch (error) {
                console.log(error);
            }
        }

        gagan(); 
    </script>
</body>

</html>

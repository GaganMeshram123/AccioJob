<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch this</title>
</head>
<style>
    #container {
        display:grid;
        grid-template-columns: repeat(3,1fr);
        gap:15px
    }
    .card {
        border: 1px solid black;
        padding: 15px;
        border-radius: 10px;
    }
</style>
<body>
    <h1>user list</h1>
    <div id="container"></div>
    <script>
        async function gaag() {
            try {
                let gagan1 = await fetch("https://jsonplaceholder.typicode.com/users");
                let data = await gagan1.json();

                let container = document.getElementById("div");
                data.forEach(val => {
                    console.log(val);

                    let card = document.createElement("div");
                    card.className = "card";

                    card.innerHTML = `
                        <h2>${val.name}</h2>
                        <p>Email: ${val.email}</p>
                        <p>Phone: ${val.phone}</p>
                        <p>Website: ${val.website}</p>
                    `;

                    container.append(card);

                });
            }
            catch (error) {
                console.log("error");
            }
        }
        gaag(); //lagech honar assa 

    </script>
</body>

</html>

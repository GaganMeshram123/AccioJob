<html lang="en">
<head>

    </form>
    <div id="gagan"></div>
    <script>
        let formid = document.querySelector("#formid");
        let nameinput = document.querySelector("#nameinput");
        let passwordinput = document.querySelector("#passwordinput");
        let emailinput = document.querySelector("#emailinput");
        let presenting = document.getElementById("gagan");
        let btn = document.querySelector("#btn")
        formid.addEventListener("submit",function(){
                event.preventDefault();
            let nam = nameinput.value;
            let ema = emailinput.value;

            presenting.append(nam,ema);
            document.body.append(presenting);

        })

    </script>
</body>

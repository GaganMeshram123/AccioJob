  let form = document.querySelector("#gagan");
  let input = document.querySelector("#gag1");

  form.addEventListener("submit", function(event) {
    event.preventDefault();
    let userInput = input.value.trim();

    if (userInput === "") return;

    // 1. Get existing items from localStorage, or start with an empty array ([]) if it's empty
    let savedItems = JSON.parse(sessionStorage.getItem("myList")) || [];

    // 2. Push the new user input into the array
    savedItems.push(userInput);

    // 3. Convert the array to a string and save it back to localStorage
    sessionStorage.setItem("myList", JSON.stringify(savedItems));

    console.log("Current list of items:", savedItems);

    // Clear the input box for the next entry
    input.value = "";
  });

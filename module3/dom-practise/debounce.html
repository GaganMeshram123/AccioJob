<body>
    <input id="gagan">

    <script>
    let gagan = document.querySelector("#gagan");
    function debounce(callback,delay){
        let timer;

        return function(event){
            clearTimeout(timer);
            timer = setTimeout(() => {
                callback(event);
            }, delay);
        }
    }
    function searchhandler(event){
        console.log(event.target.value);
    }
     debouncehandler = debounce(searchhandler,1000);
     gagan.addEventListener("input",debouncehandler);

 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <form id="gagan1">
        <label for="gagan2">Name</label>
        <input placeholder="name" id="gagan2">
        
        <label for="gagan3">email</label>
        <input type="email" placeholder="email" id="gagan3">

        <label for="gagan4">password</label>
        <input type="password" placeholder="password" id="gagan4">
        
        <button id="gagan5">submit</button>
    </form>
    <script>
        
       
let gagan1 = document.querySelector("#gagan1");
let gagan2 = document.querySelector("#gagan2");
let gagan3 = document.querySelector("#gagan3");
let gagan4 = document.querySelector("#gagan4");

gagan1.addEventListener("submit", function(event) {
    event.preventDefault();

    let userdata = {
        name: gagan2.value,
        email: gagan3.value
    };

    // Get previous users, or create an empty array
    let user = JSON.parse(localStorage.getItem("user")) || [];

    // Add the new user
    user.push(userdata);

    // Save all users
    localStorage.setItem("user", JSON.stringify(user));

    console.log(user);

    // Clear the form
    gagan1.reset();

    alert("User saved successfully!");

});
     
    </script>
 </body>
 </html>
